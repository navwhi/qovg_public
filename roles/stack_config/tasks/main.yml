---
- name: Make sure every required secret has been overridden (vault)
  ansible.builtin.assert:
    that: item.value != 'CHANGEME'
    fail_msg: >-
      {{ item.name }} still has its CHANGEME default value. Define it in
      inventory/group_vars/qwen_servers/vault.yml (ansible-vault) and run
      the playbook with --ask-vault-pass.
    quiet: true
  loop: "{{ stack_config_required_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Deploy the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ qwen_monitoring_dir }}/prometheus.yml"
    mode: "0644"
  notify: Restart Prometheus

- name: Deploy the Nginx configuration
  ansible.builtin.template:
    src: nginx-qwen-code.conf.j2
    dest: "{{ qwen_nginx_conf_dir }}/qwen-code.conf"
    mode: "0644"
  notify: Reload Nginx

- name: Deploy the docker-compose.yml file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qwen_compose_dir }}/docker-compose.yml"
    mode: "0600"
